<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<body>

<header class="header">
  <div class="container nav">
    <h1 class="logo">ALARMA</h1>
    <button class="nav-toggle" aria-label="Меню">☰</button>
    <ul class="nav__list">
      <li><a href="index.html" class="nav__link">Главная</a></li>
      <li><a href="portfolio.html" class="nav__link">Проекты</a></li>

<section class="contact">
  <div class="container">
    <h2 class="section-title">Контакты</h2>
    <p class="contact-intro">Есть проект? Обсудим.</p>

    <form id="contactForm" class="contact-form">
      <input type="text" id="name" placeholder="Имя" required>
      <input type="email" id="email" placeholder="Email" required>
      <textarea id="message" placeholder="Сообщение" rows="5" required></textarea>
      <button type="submit" class="btn">Отправить</button>
    </form>

    <div id="formMessage" class="form-message"></div>
  </div>
</section>

  </div>
